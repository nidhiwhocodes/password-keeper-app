<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Keeper</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Password Keeper</h1>

<p>Total Passwords:
<span id="total">0</span>
</p>

<div class="search">

<input
type="text"
id="search"
placeholder="Search by title">

</div>

<div class="form">

<input
type="text"
id="title"
placeholder="Title (gmail, github...)">

<input
type="password"
id="password"
placeholder="Password">

<button id="addBtn">Add</button>

</div>



<h2>All Passwords</h2>

<table>

<thead>

<tr>

<th>Title</th>

<th>Password</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="passwordList">

</tbody>

</table>

</div>

<script src="script.js"></script>

</body>
</html>
